# =============================================================================
# BioMe AlphaMissense Calibration Pipeline — central config
# Every script reads this file. Edit paths/params here; do NOT hard-code in code.
# =============================================================================

# -- Project layout (relative paths resolved from repo root) ------------------
paths:
  repo_root: "."                  # resolved at runtime
  refs_dir: "refs"
  intermediate_dir: "intermediate"
  results_dir: "results"
  logs_dir: "logs"

# -- Reference inputs (read-only) ---------------------------------------------
references:
  alphamissense_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/AlphaMissense/data/AlphaMissense_hg38.tsv.gz"
  gencode_transcript_map: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/AlphaMissense/data/gencode.v32.transcriptID_genename.tsv"
  # Gencode v32 annotation GTF. 00_prepare_refs.sh will download from this URL
  # if local_gtf is unset or missing. If both fetch and local lookup fail, 00
  # falls back to AM-row min/max POS per gene with a LOUD warning.
  gencode_gtf_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_32/gencode.v32.primary_assembly.annotation.gtf.gz"
  gencode_gtf_local: ""           # optional: drop-in local path overrides URL
  # ClinVar VCF (GRCh38, to match AlphaMissense hg38). 00_prepare_refs.sh
  # downloads this and prepare_refs.subset_clinvar() subsets it to the target
  # genes + P/LP ≥2★ (see the `clinvar:` block) -> refs/clinvar_plp_2star.target_genes.tsv.gz
  clinvar_vcf_url: "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz"
  clinvar_vcf_local: ""           # optional pre-staged Minerva path; overrides URL

# -- Calibration (Chen/Pejaver variant-level table; per-variant LOOKUP) -------
# 00_prepare_refs.sh wgets the Chen tarball, extracts it, and prepare_refs.py
# subsets it to the 28 target genes -> refs/chen_calibration.target_genes.tsv.gz
# (bgzip + tabix-indexed by (chrom, pos)). Step 02 (annotate_am.py) joins
# every BioMe variant against this table by (chrom,pos,ref,alt) and attaches
# the published `evidence` label per variant. Step 03 (call_carriers.py) sets
# is_AM_carrier_primary = TRUE iff that label is at least PP3_<min_evidence_strength>.
#
# We do NOT re-derive per-gene thresholds — Chen has already applied the
# gene-specific (single_gene) or domain-aggregate calibration curve to every
# variant in the table. See https://github.com/yileevechen/VEP_calibration
calibration:
  zenodo_record: "18668684"
  zenodo_file_url: "https://zenodo.org/records/18668684/files/variant_level_calibration_table_AlphaMissense.csv.tar.gz?download=1"
  zenodo_api_url: ""              # legacy; leave empty
  local_file: ""                  # bypass network: drop the extracted CSV here
  # Minimum ACMG-PP3 strength a variant must carry in Chen's table to count as
  # a primary carrier. Options: Supporting | Moderate | Strong | Very Strong.
  # "Moderate" includes PP3_Moderate, PP3_Moderate+, PP3_Strong, PP3_Strong+,
  # PP3_VeryStrong (i.e. the "+" Tavtigian intermediate strength is included).
  # BP4_* and NO_EVIDENCE are always excluded.
  min_evidence_strength: "Moderate"
  # Locked: only the published Chen label drives the primary call.
  primary_threshold: "gene_specific"   # one of: gene_specific
  # Counterfactual: the published global threshold from the original BioMe
  # AM analysis. step 03 emits is_AM_carrier_global_0864 = (am_pathogenicity >=
  # this) regardless of Chen calibration, so figures can compare what the old
  # threshold would have called vs the gene-specific calibration we now use.
  # Independent of primary_threshold — purely descriptive.
  global_threshold_legacy: 0.864

# -- Target gene panel (28 genes; locked; SDHD present) -----------------------
target_genes:
  - APC
  - BMPR1A
  - BRCA1
  - BRCA2
  - MAX
  - MEN1
  - MLH1
  - MSH2
  - MSH6
  - NF2
  - PALB2
  - PMS2
  - PTEN
  - RB1
  - RET
  - SDHAF2
  - SDHB
  - SDHC
  - SDHD
  - SMAD4
  - STK11
  - TMEM127
  - TP53
  - TSC1
  - TSC2
  - VHL
  - WT1
  - MUTYH

# -- Table S5 gene groups (15 syndromes; SDHD in paraganglioma) ---------------
gene_groups:
  Hereditary_Breast_and_Ovarian_Cancer_Syndrome: [BRCA1, BRCA2, PALB2]
  Lynch_Syndrome:                                 [MLH1, MSH2, MSH6, PMS2]
  Familial_Adenomatous_Polyposis:                 [APC]
  MUTYH_Associated_Polyposis:                     [MUTYH]
  Multiple_Endocrine_Neoplasia:                   [MEN1, RET]
  Hereditary_Paraganglioma_Pheochromocytoma:      [SDHAF2, SDHB, SDHC, SDHD, TMEM127, MAX]
  Li_Fraumeni_Syndrome:                           [TP53]
  Tuberous_Sclerosis_Complex:                     [TSC1, TSC2]
  Von_Hippel_Lindau_Syndrome:                     [VHL]
  PTEN_Hamartoma_Tumor_Syndrome:                  [PTEN]
  Juvenile_Polyposis_Syndrome:                    [BMPR1A, SMAD4]
  Hereditary_Retinoblastoma:                      [RB1]
  Peutz_Jeghers_Syndrome:                         [STK11]
  Neurofibromatosis_Type_2:                       [NF2]
  Wilms_Tumor_Syndrome:                           [WT1]

# -- QC parameters (locked defaults; no AF) -----------------------------------
qc:
  filter_pass_only: true          # site FILTER == PASS
  min_dp: 10                      # FMT/DP >= 10
  min_gq: 20                      # FMT/GQ >= 20
  ab_lo: 0.2                      # het allele balance lower bound
  ab_hi: 0.8                      # het allele balance upper bound
  drop_homref: true
  drop_missing: true
  # NOTE: no allele-frequency filter. Do not add one (locked decision D).

# -- Cohorts ------------------------------------------------------------------
cohorts:
  cohortI:
    name: "cohortI"
    mode: "per_chr_input"
    vcf_dir: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/Regeneron/cancerChr"
    # The per-chr filename pattern. {chr} will be replaced with e.g. chr1.
    vcf_pattern: "SINAI_Freeze_Two.GL.pVCF.PASS.onTarget.biallelic.{chr}.cancerGenes.vcf.gz"
    phenotype_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/Regeneron/metadata/RegenWXS_HX_Newgroups.250109.tsv"
    id_column: "SINAI_ID"
    acmg_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/AlphaMissense/2cohort/CarrFreq/Regen_VariantsInSamplesPLPorPTV.tsv"
  cohortII:
    name: "cohortII"
    mode: "sliced_from_combined"
    combined_vcf: "/sc/private/regen/data/Sema4/BioMe_Sema4_WES.vcf.gz"
    # NEVER beside the read-only source. The pre-step puts a symlink to the
    # source plus its .csi index under this writable directory; the 01 array
    # reads from `${local_source_dir}/$(basename combined_vcf)`.
    local_source_dir: "intermediate/cohortII"
    phenotype_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/metadata/Sema4WXS_HX_Newgroups.250109.tsv"
    id_column: "MASKED_MRN"
    acmg_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/AlphaMissense/2cohort/CarrFreq/Sema4_VariantsInSamplesPLPorPTV.tsv"

# -- Ancestry PCs (shared) ----------------------------------------------------
pcs:
  pcs_tsv: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/GSA_GDA_PCA_V2.txt"
  # The real BioMe PC file keys on MASKED_MRN. Cohort II's phenotype keys on
  # MASKED_MRN directly, so its PC join is straight. Cohort I's phenotype keys
  # on SINAI_ID — it joins to PCs via the id_bridge below
  # (SINAI_ID -> MASKED_MRN -> PC1..10).
  id_column: "MASKED_MRN"
  # Auto-discovery fallback runs when id_column is empty AND no bridge is
  # configured (e.g. synthetic tests where PCs key directly on phenotype IDs).
  pc_columns: ["PC1","PC2","PC3","PC4","PC5","PC6","PC7","PC8","PC9","PC10"]

# -- ID bridge ---------------------------------------------------------------
# Required for cohort I's PC join. The bridge is a TSV with columns matching
# map_sinai_id_col and map_masked_mrn_col. Each cohort can opt out by leaving
# its `use_bridge` flag false; cohort II's phenotype already keys on
# MASKED_MRN so no bridge is needed.
id_bridge:
  masked_mrn_map: "/sc/arion/projects/rg_huangk06/variants_PLP_BioMe/Masked_mrn_map.txt"
  map_sinai_id_col: "RGNID"
  map_masked_mrn_col: "MASKED_MRN"
  # Cohort -> whether to use the bridge for the PC join.
  use_for:
    cohortI: true
    cohortII: false

# -- ACMG comparison ----------------------------------------------------------
acmg:
  # rows in the ACMG TSV whose `annotation` column contains this substring
  # are treated as the comparison set. PTV is INCOMPARABLE to AM-missense.
  annotation_filter_substr: "P/LP"
  annotation_column: "annotation"

# -- ClinVar comparison (second clinical-truth track) -------------------------
# A STANDALONE pass (annotate_clinvar.py, LSF step 02c) reads each cohort's
# QC'd VCF and flags carriers of a ClinVar P/LP variant that passes the filter
# below. The AM/Chen path (annotate_am.py / call_carriers.py) is untouched.
# compare_tabulate.py then joins the ClinVar carrier list exactly like the ACMG
# list and redefines AM_calibrated_not_PLP = AM-calibrated AND NOT ACMG P/LP
# AND NOT ClinVar P/LP.
#
# CAVEAT: step 01 emits an SNV-only QC'd VCF, so this list covers target-gene
# SNV P/LP variants (missense, nonsense, splice-region SNVs) — inframe indels
# are out of reach. To stay comparable to the ACMG comparator (which drops PTV
# rows) we also exclude PTV/LoF molecular consequences via ClinVar's `MC` field.
clinvar:
  min_review_stars: 2             # CLNREVSTAT gold stars (0-4); keep >= this
  sig_include: ["Pathogenic", "Likely_pathogenic", "Pathogenic/Likely_pathogenic"]
  exclude_conflicting: true       # drop Conflicting_classifications_of_pathogenicity
  exclude_ptv: true               # drop nonsense/frameshift/splice-acceptor/-donor (MC)

# -- LSF resources per stage (Minerva acc_DiseaseGeneCell / premium) ----------
lsf:
  project: "acc_DiseaseGeneCell"
  queue:   "premium"
  step_00_prepare_refs:    { n: 2,  W: "02:00", mem: "8000" }     # login node typically; here for record
  step_01_qc_missense:     { n: 8,  W: "08:00", mem: "16000" }
  step_02_annotate_am:     { n: 8,  W: "12:00", mem: "24000" }    # annotation gets more
  step_02_gather:          { n: 2,  W: "02:00", mem: "8000"  }
  step_03_call_carriers:   { n: 4,  W: "04:00", mem: "16000" }
  step_04_compare_tab:     { n: 4,  W: "04:00", mem: "16000" }
  step_05_run_stats:       { n: 4,  W: "02:00", mem: "16000" }
  step_06_make_figures:    { n: 2,  W: "01:00", mem: "8000"  }
  step_index_cohortII:     { n: 2,  W: "04:00", mem: "8000"  }
