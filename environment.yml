# Conda fallback for sites without Minerva Lmod modules.
# Usage: conda env create -f environment.yml && conda activate biome-am
name: biome-am
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.11
  - bcftools>=1.17
  - htslib>=1.17       # provides bgzip and tabix
  - pandas>=2.0
  - numpy>=1.24
  - pyyaml>=6.0
  - requests>=2.31
  # rebuttal-stats stack (run_stats.py + figures/*.py)
  - scipy>=1.10
  - statsmodels>=0.14
  - matplotlib>=3.7
  - seaborn>=0.13
  - scikit-learn>=1.3
