# Reviewer / Action mapping for each figure + table panel.
#
# The rebuttal letter cites a figure or table next to each reviewer quote;
# this file keeps the panel <-> Action <-> reviewer-quote mapping in one place
# so the citations don't drift as figures are renumbered. Update both the
# figure docstring and this YAML when you change a panel's purpose.
#
# Schema (per entry):
#   panel:     "figNX" or "TableN" or "TableSN"
#   actions:   list of Action numbers from a6017a48-Summary_of_Reviewer_Comments.md
#   reviewers: list of R1/R2/R3 — the reviewer(s) whose concern this addresses
#   quote:     verbatim snippet from the reviewer letter (max ~120 chars).
#              Reviewer quotes have NOT been pasted yet; placeholders below
#              flag the slot. Replace once the user provides the full letter.
panels:

  - panel: fig1A
    actions: [Action_2]
    reviewers: [R3]
    quote: "REVIEWER QUOTE PENDING — ClinVar review-status stratification ask"

  - panel: fig1B
    actions: [Action_2]
    reviewers: [R2, R3]
    quote: "REVIEWER QUOTE PENDING — per-gene calibration headline number"

  - panel: fig1C
    actions: [Action_2, Action_1]
    reviewers: [R3]
    quote: "REVIEWER QUOTE PENDING — AM-on-true-VUSs"

  - panel: fig1D
    actions: [Action_2]
    reviewers: [R2]
    quote: "REVIEWER QUOTE PENDING — gene-specific threshold map"

